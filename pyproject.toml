[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatch-core"
version = "0.1.0"
description = "Road graph dispatch system with quadtree routing and A* pathfinding"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Arup Halder", email = "aruphalder2526@gmail.com"}
]

dependencies = [
    "osmnx>=2.0,<3",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9",
    "pytest-cov>=4.0,<6",
    "hypothesis>=6.80,<7",
    "ruff>=0.4.0,<1",
    "mypy>=1.8,<3",
]

[project.scripts]
dispatch-core = "dispatch_core.__main__:main"

[tool.setuptools]
packages = ["dispatch_core"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (ruff format will handle)
]

[tool.ruff.lint.isort]
known-first-party = ["dispatch_core"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["osmnx.*", "networkx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/dispatch_core --cov-report=term-missing --cov-report=html -v"
